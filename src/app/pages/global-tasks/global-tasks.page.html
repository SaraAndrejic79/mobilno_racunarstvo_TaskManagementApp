<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-content">
      <div class="back-btn" (click)="goBack()">←</div>
      <h2 class="page-title">Zajednički zadaci</h2>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrap">

    <p class="page-desc">Zadaci koje dele svi korisnici. Klikni da vidiš komentare i dodaš svoj.</p>

    <div *ngIf="isLoading" class="spinner-wrap">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <div *ngIf="errorMsg" class="error-banner">{{ errorMsg }}</div>

    <div class="tasks-list" *ngIf="!isLoading">
      <div class="task-card" *ngFor="let task of globalTasks" (click)="goToDetail(task)">
        <div class="task-icon">
          <svg *ngIf="task.icon === 'calendar-outline'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="3"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
          </svg>
          <svg *ngIf="task.icon === 'sunny-outline'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
            <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          </svg>
          <svg *ngIf="task.icon === 'checkmark-circle-outline'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <div class="task-info">
          <div class="task-title">{{ task.title }}</div>
          <div class="task-desc">{{ task.description }}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>

  </div>
</ion-content>
